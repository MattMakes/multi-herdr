[workspace]
resolver = "2"
members = [
    "crates/horch-core",
    "crates/horch-marketplace",
    "crates/horch-platform",
    "crates/horch",
    "crates/horch-e2e",
    "crates/herdr-install",
    "crates/agent-docs-sync",
    "crates/ui-prop-tester",
]

[workspace.package]
version = "0.5.2"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
horch-core = { path = "crates/horch-core" }
horch-marketplace = { path = "crates/horch-marketplace" }
horch-platform = { path = "crates/horch-platform" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
