[package]
name = "horch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "horch"
path = "src/main.rs"

[dependencies]
horch-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"

[dev-dependencies]
serde_yaml.workspace = true

# `setsid`, so the grid tidy a departing worker leaves behind outlives the pane.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
