[package]
name = "ui-prop-tester"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]

[[bin]]
name = "ui-prop-tester"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
boa_engine = "0.21.1"
clap.workspace = true
regex-syntax = "0.8.11"
