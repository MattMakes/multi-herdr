serde_json.workspace = true
tempfile = "3.27.0"
tungstenite = "0.30.0"
unicode-width = "0.2"
vte = "0.15.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
nix = { version = "0.32.0", features = ["term", "process", "signal", "poll", "fs", "ioctl"] }
