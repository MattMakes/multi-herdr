<!doctype html>
<!-- Text audit fixture: passes every rule. It has a slide-in from off frame, a counter
     whose digits change, a word that stays long enough, and canvas text. -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 1920px; height: 1080px; background: #101820; color: #f4f4f4; font-family: sans-serif; overflow: hidden; }
.t { position: absolute; margin: 0; white-space: nowrap; line-height: 1; }
#title { left: 160px; top: 120px; font-size: 96px; }
#sub { left: 160px; top: 300px; font-size: 64px; }
#count { left: 160px; top: 480px; font-size: 72px; }
#late { left: 1000px; top: 480px; font-size: 96px; }
#c { position: absolute; left: 1000px; top: 640px; width: 800px; height: 160px; }
</style></head><body>
<p class="t" id="title">Ship every frame</p>
<p class="t" id="sub">One command renders it all</p>
<p class="t" id="count">Users: 0</p>
<p class="t" id="late">Today</p>
<canvas id="c" width="800" height="160"></canvas>
<script>
window.__videoMeta = { width: 1920, height: 1080, fps: 30, duration: 3.0 };
const ctx = document.getElementById("c").getContext("2d");
window.__seekToFrame = function (frameIndex, fps) {
  const t = frameIndex / fps;
  const k = Math.min(1, t / 0.5);
  document.getElementById("sub").style.transform = "translateX(" + Math.round((1 - k) * -1200) + "px)";
  document.getElementById("count").textContent = "Users: " + Math.round(t * 4100).toLocaleString("en-US");
  document.getElementById("late").style.visibility = t >= 1.0 ? "visible" : "hidden";
  ctx.clearRect(0, 0, 800, 160);
  ctx.fillStyle = "#f2aa4c";
  ctx.font = "64px sans-serif";
  ctx.fillText("Made with care", 10, 100);
};
</script></body></html>
