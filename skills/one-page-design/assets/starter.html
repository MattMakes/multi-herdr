<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One-page design</title>
<!--
  Starter for a one-page design. Copy this file, then compose the page.

  Rules for this file:
  - The sheet size lives in ONE place: --sheet-w and --sheet-h on :root, in
    inches. The screen sheet and the printed page both read those two values.
    Never put a size, or any inline style, on <main class="sheet">.
  - Start at the smallest size where the centre picture is legible. Grow it
    only until all three text levels fit. No side over 44in.
  - Keep the page one file: no <script>, no <link>, no web fonts, no remote
    images. A commissioned picture goes in as a data: URI.
  - Nothing hidden: no links, tabs, collapsed sections, hover effects or
    display rules that hide content.
  - Run scripts/check_page.py on the page before you hand it over.
-->
<style>
  :root {
    --sheet-w: 17in;
    --sheet-h: 11in;

    --ink: #1d1c1a;
    --paper: #fbf8f1;
    --rule: #8d8a84;
    --accent: #c8361d;
    --wash-1: #e6eef4;
    --wash-2: #edf2e2;
    --wash-3: #f6ead8;
    --muted: #55524d;
  }

  @page {
    size: var(--sheet-w) var(--sheet-h);
    margin: 0;
  }

  html, body {
    margin: 0;
    background: #dcdbd7;
    overflow: auto;
  }

  body {
    padding: 0.5in;
  }

  .sheet {
    position: relative;
    display: block;
    box-sizing: border-box;
    width: var(--sheet-w);
    height: var(--sheet-h);
    margin: 0 auto;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 11pt;
    line-height: 1.3;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
  }

  @media print {
    html, body {
      background: none;
      padding: 0;
    }
    .sheet {
      margin: 0;
      box-shadow: none;
    }
  }

  /* Three text levels. Nothing smaller than level three. */
  .t1 { font-size: 28pt; font-weight: bold; letter-spacing: 0.02em; line-height: 1.1; }
  .t2 { font-size: 11pt; }
  .t3 { font-size: 7pt; }

  /* Text styles: story, rule, parameters, formula. */
  .story { font-style: italic; }
  .rule { font-style: normal; }
  .param { font-size: 7pt; font-style: italic; color: var(--muted); }
  .formula {
    display: inline-block;
    font-family: Menlo, Consolas, "Courier New", monospace;
    font-size: 7pt;
    background: #ffffff;
    border: 0.5pt solid var(--rule);
    padding: 2pt 4pt;
  }

  /* Positioned parts. Place each one in inches. */
  .title {
    position: absolute;
    top: 0.4in;
    left: 0.5in;
    margin: 0;
    max-width: 60%;
  }
  .stamp {
    position: absolute;
    right: 0.5in;
    bottom: 0.3in;
    font-size: 8pt;
    color: var(--muted);
  }
  .callout {
    position: absolute;
    width: 2in;
    font-size: 9pt;
  }
  .callout h3 {
    margin: 0 0 2pt;
    font-size: 11pt;
  }
  .card {
    position: absolute;
    width: 2.2in;
    box-sizing: border-box;
    background: #ffffff;
    border: 0.75pt solid var(--ink);
    border-radius: 6pt;
    padding: 5pt 6pt;
    font-size: 7pt;
  }
  .card h4 {
    margin: 0;
    font-size: 10pt;
    font-weight: bold;
  }
  .card .sub {
    margin: 0 0 3pt;
    font-size: 8pt;
    color: var(--accent);
  }
  .card .row {
    display: flex;
    gap: 4pt;
    align-items: baseline;
    font-size: 7pt;
  }
  .legend {
    position: absolute;
    background: #ffffff;
    border: 0.5pt solid var(--rule);
    padding: 4pt 6pt;
    font-size: 7pt;
  }

  /* SVG strokes for the drawing layer. */
  .lead { fill: none; stroke: var(--rule); stroke-width: 1.2; }
  .outline { stroke: var(--ink); stroke-width: 2; }
</style>
</head>
<body>
<main class="sheet">
  <h1 class="title t1">State the one point of this page in one sentence</h1>

  <!-- CENTRE PICTURE: make it first, before any prose. Drawn: one inline SVG
       layer pinned to all four sheet edges, viewBox 0 0 (100 x width in)
       (100 x height in). Commissioned: one <img> with a data: URI, with the
       filled illustrator request beside it as a comment. -->

  <!-- MARGIN PARTS: callouts (8 at most), card sets (3 at most, along one or
       two edges), a legend when any mark repeats. -->

  <p class="stamp">Draft · 2026-01-01</p>
</main>
</body>
</html>
